# Все параметры пайплайна в одном месте.
collect:
  version: "v2"  # v1: train QASPER; v2: train + dev QASPER
  sources:
    v1:
      - "sources/qasper-train-v0.3.json"
    v2:
      - "sources/qasper-train-v0.3.json"
      - "sources/qasper-dev-v0.3.json"
  verify_answer_span: true
  system_prompts:
    - "Answer the question about the NLP paper using only the supplied evidence. Give the exact answer span; do not add unsupported facts."
    - "Read the excerpt from an NLP research paper. Reply to the question with the answer stated in that excerpt, without speculation."
    - "Use the provided passage to answer the research question. Return only the relevant text span from the paper."
    - "Find the answer in the evidence from the NLP paper. Keep the response concise and grounded in the quoted passage."
    - "You are checking facts in an NLP paper. Answer from the given evidence only, using the wording of the source."

clean:
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"  # topic = arXiv paper ID
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85  # совпадает с clean.near_dup.threshold

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
